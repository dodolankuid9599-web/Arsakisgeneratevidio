<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Aplikasi Saya</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4F46E5" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AppKu" />

<style>
  :root {
    --brand-start: #4F46E5;
    --brand-end: #7C3AED;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #frame-wrap {
    position: fixed;
    inset: 0;
  }

  iframe {
    border: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #ffffff;
  }

  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(160deg, var(--brand-start), var(--brand-end));
    color: #ffffff;
    z-index: 10;
    transition: opacity .35s ease, visibility .35s ease;
  }
  #loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.35);
    border-top-color: #ffffff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p {
    margin: 0;
    font-size: 14px;
    letter-spacing: .02em;
    opacity: .9;
  }

  #offline-banner {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: #1f2937;
    color: #ffffff;
    font-size: 13px;
    z-index: 20;
  }
  #offline-banner.show { display: flex; }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat aplikasi&hellip;</p>
  </div>

  <div id="frame-wrap">
    <iframe
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycbxLFNGRW9hKEgsqBcbte2k7aXIC_FEa4oQQxSs6ARtxTdq2CoaNN-nhT173lM50Ld1eqA/exec"
      title="Aplikasi"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <div id="offline-banner">Tidak ada koneksi internet — sebagian fitur mungkin tidak berfungsi.</div>

  <script>
    var loader = document.getElementById('loader');
    var frame = document.getElementById('app-frame');
    var offlineBanner = document.getElementById('offline-banner');
    var hidden = false;

    function hideLoader() {
      if (hidden) return;
      hidden = true;
      loader.classList.add('hidden');
    }

    frame.addEventListener('load', hideLoader);
    // Jaga-jaga kalau event 'load' iframe tidak terpicu (misal karena
    // beberapa pembatasan browser) — sembunyikan loader setelah beberapa detik.
    setTimeout(hideLoader, 6000);

    function updateOnlineStatus() {
      offlineBanner.classList.toggle('show', !navigator.onLine);
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Gagal mendaftarkan service worker:', err);
        });
      });
    }
  </script>
</body>
</html>
